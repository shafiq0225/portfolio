name: Build and Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href /portfolio/

      - name: Determine Output Directory
        id: output_dir
        run: |
          if [ -d "dist/app-portfolio/browser" ]; then
            echo "dir=dist/app-portfolio/browser" >> $GITHUB_OUTPUT
          else
            echo "dir=dist/app-portfolio" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.output_dir.outputs.dir }}
          branch: gh-pages
