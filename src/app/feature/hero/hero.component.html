<section class="hero-section">
    <div class="hero-content">
        <p class="p1 animate" [ngClass]="{ 'fade-up': isLoading() }">
            Hi, my name is
        </p>
        <span class="name-holder">
            <h1 class="gradient t1 animate" [ngClass]="{ 'fade-up': isLoading() }">
                Shafiq
            </h1>
            <h1 class="gradient t2 animate" [ngClass]="{ 'fade-up': isLoading() }">
                Ahamed.
            </h1>
        </span>
        <p class="title-statement animate" [ngClass]="{ 'fade-up': isLoading() }">
            I'm a <span class="job-title">Senior Software Engineer</span> specialising in
            distributed backend systems, event-driven microservices, and Micro Frontend architecture —
            currently building Dell's global e-commerce platform at
            <a href="https://www.ey.com/en_in" target="_blank">EY</a>.
        </p>
        <div class="hero-tags animate" [ngClass]="{ 'fade-up': isLoading() }">
            <span class="tag">ASP.NET Core</span>
            <span class="tag">Apache Kafka</span>
            <span class="tag">Cassandra</span>
            <span class="tag">Angular 18</span>
            <span class="tag">Microservices</span>
            <span class="tag">MFE</span>
        </div>
        <app-social-links class="social-media-links animate" [ngClass]="{ 'fade-up': isLoading() }"></app-social-links>
    </div>

    <div class="hero-image-holder animate" [ngClass]="{ 'fade-up': isLoading() }">
        <img
          ngSrc="./assets/hero_image.svg"
          width="250"
          height="250"
          class="hero-image"
          ngSrcset="100w, 200w, 300w"
          alt="Shafiq Ahamed - Senior Software Engineer"
          priority
        />
    </div>
</section>
