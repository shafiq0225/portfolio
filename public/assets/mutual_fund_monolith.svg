  <circle cx="250" cy="25" r="5" fill="#F59E0B"/>

  <rect x="25" y="145" width="250" height="35" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1"/>
  <text x="150" y="167" font-family="Arial" font-size="12" font-weight="bold" fill="#A7F3D0" text-anchor="middle">AMFI NAV &amp; PORTFOLIO TRACKER</text>
