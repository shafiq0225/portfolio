<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="bg-mfe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="accent-mfe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="12" fill="url(#bg-mfe)"/>
  <!-- Microservices Grid Nodes -->
  <rect x="25" y="30" width="70" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">Auth API</text>

  <rect x="115" y="30" width="70" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="150" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">Order API</text>

  <rect x="205" y="30" width="70" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">NAV API</text>

  <!-- Connectors -->
  <path d="M 60 75 L 60 105 L 150 105 L 150 75" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 150 105 L 240 105 L 240 75" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Kafka / MFE Core Box -->
  <rect x="50" y="125" width="200" height="50" rx="8" fill="url(#accent-mfe)"/>
  <text x="150" y="147" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MUTUAL FUND MFE</text>
  <text x="150" y="163" font-family="Arial" font-size="10" fill="#DBEAFE" text-anchor="middle">Kafka Events • Angular MFE</text>
</svg>